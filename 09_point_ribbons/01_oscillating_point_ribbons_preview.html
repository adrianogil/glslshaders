<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscillating Point Ribbons</title>
<style>
  :root { color-scheme: dark; font: 15px system-ui, sans-serif; background: #111; color: #eee; }
  body { max-width: 820px; margin: 32px auto; padding: 0 20px; }
  h1 { font-size: 24px; font-weight: 500; }
  canvas { display: block; width: min(100%, 600px); aspect-ratio: 1; background: #090909; margin: 24px auto; }
  .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  button, select { font: inherit; padding: 7px 12px; }
  input { vertical-align: middle; }
  p, output { color: #bbb; }
  a { color: #b7d9ff; }
  #status { min-height: 1.5em; }
  #time { width: min(45vw, 280px); }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
</style>
<h1>Oscillating Point Ribbons</h1>
<p>10,000 points · one fragment shader · adapted from yuruyurau</p>
<canvas id="canvas" width="400" height="400" aria-label="Animated white point ribbons on a dark background"></canvas>
<div class="controls">
  <button id="play" type="button">Pause</button>
  <button id="reset" type="button">Reset</button>
  <label>Resolution <select id="resolution"><option>240</option><option selected>400</option><option>600</option></select></label>
  <label>Time <input id="time" type="range" min="0" max="8" step="0.0166667" value="0"></label>
  <output id="time-value">0.00 s</output>
</div>
<p id="status" role="status">Compiling shader…</p>
<p>Paste the <a href="./01_oscillating_point_ribbons.frag">fragment source</a> into Shadertoy’s Image tab. Leave all channels empty.</p>
<details><summary>Shader source</summary><pre id="source"></pre></details>
<script type="module">
const canvas = document.querySelector('#canvas');
const status = document.querySelector('#status');
const play = document.querySelector('#play');
const slider = document.querySelector('#time');
const timeValue = document.querySelector('#time-value');
try {
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) throw new Error('WebGL 2 is unavailable.');
  const response = await fetch('./01_oscillating_point_ribbons.frag');
  if (!response.ok) throw new Error(`Shader load failed: ${response.status}`);
  const source = await response.text();
  document.querySelector('#source').textContent = source;
  function compile(type, text) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, text);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const message = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(message);
    }
    return shader;
  }
  const vertex = compile(gl.VERTEX_SHADER, `#version 300 es
    void main() {
      vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
    }`);
  const fragment = compile(gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float;
    uniform vec3 iResolution;
    uniform float iTime;
    out vec4 outputColor;
    ${source}
    void main() { mainImage(outputColor, gl_FragCoord.xy); }`);
  const program = gl.createProgram();
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const resolutionLocation = gl.getUniformLocation(program, 'iResolution');
  const timeLocation = gl.getUniformLocation(program, 'iTime');
  let running = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let time = 0;
  let last = performance.now();
  let dirty = true;
  function syncPlay() { play.textContent = running ? 'Pause' : 'Play'; }
  syncPlay();
  play.onclick = () => { running = !running; last = performance.now(); syncPlay(); };
  document.querySelector('#reset').onclick = () => { time = 0; dirty = true; last = performance.now(); };
  slider.oninput = () => { time = Number(slider.value); running = false; dirty = true; syncPlay(); };
  document.querySelector('#resolution').onchange = event => {
    canvas.width = canvas.height = Number(event.target.value);
    dirty = true;
  };
  canvas.addEventListener('webglcontextlost', event => {
    event.preventDefault(); running = false; syncPlay(); status.textContent = 'Graphics context lost. Reload to restart.';
  });
  function frame(now) {
    if (running) { time = (time + (now - last) / 1000) % 8; dirty = true; }
    last = now;
    if (dirty && !gl.isContextLost()) {
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform3f(resolutionLocation, canvas.width, canvas.height, 1);
      gl.uniform1f(timeLocation, time);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      slider.value = time;
      timeValue.value = `${time.toFixed(2)} s`;
      dirty = false;
    }
    requestAnimationFrame(frame);
  }
  status.textContent = 'Ready · 8-second loop · lower resolution reduces GPU work';
  requestAnimationFrame(frame);
} catch (error) {
  status.textContent = error.message;
  console.error(error);
  document.querySelectorAll('button, input, select').forEach(control => { control.disabled = true; });
}
</script>
</html>
